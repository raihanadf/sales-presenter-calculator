name: sales_presenter
description: Sales presenter calculator app.
publish_to: "none"
version: 1.0.6+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_liquid_glass: ^0.7.1
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  open_filex: ^4.5.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1B5E4F"
  adaptive_icon_foreground: "assets/logo.png"
