name = "sales-presenter-backend"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# JWT_SECRET is NOT stored here.
#   local dev  -> read from .dev.vars (gitignored)
#   production -> `wrangler secret put JWT_SECRET`

# oldest app build allowed to write. raise it in the same deploy that ships the
# build people must move to; older apps can still read.
[vars]
MIN_APP_VERSION = "2.0.1"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "sales_presenter"
# replace after: `wrangler d1 create sales_presenter`
database_id = "ede9974a-2c39-4aa9-bb4b-f5d9ab350bac"
migrations_dir = "migrations"
